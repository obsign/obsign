[workspace]
resolver = "2"
members = ["crates/obsign-audit-core", "crates/obsign", "crates/obsign-policy", "crates/obsign-wal", "crates/obsign-proxy", "crates/obsign-identity", "crates/obsign-ledger", "crates/obsign-control-plane", "crates/obsign-pkcs11", "crates/obsign-tpm-enroll"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace]
resolver = "2"
members = ["crates/obsign-audit-core", "crates/obsign", "crates/obsign-policy", "crates/obsign-wal", "crates/obsign-proxy", "crates/obsign-identity", "crates/obsign-ledger", "crates/obsign-control-plane", "crates/obsign-pkcs11", "crates/obsign-tpm-enroll"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ed25519-dalek = "3"
hex = "0.4"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
# 0.23 turns on a `simd-unsafe` feature by default, which is the crate's only
# source of `unsafe`. Nothing here uses the SIMD engines; without the
# feature the crate stays `forbid(unsafe_code)`.
base64 = { version = "0.23", default-features = false, features = ["std"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

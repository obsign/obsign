[package]
name = "obsign"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline verifier for evidence packs. Meant to be run by the auditor, with no access to the infrastructure."

# Deliberately tiny dependency tree: this is the binary the auditor compiles
# or runs themselves. Every dependency added here is one they have to accept.
[dependencies]
obsign-audit-core = { path = "../obsign-audit-core" }
serde_json = { workspace = true }
anyhow = { workspace = true }

# Test-only: forging packs to check the exit-code contract. Kept out of
# [dependencies] so the auditor's build stays as small as advertised.
[dev-dependencies]
ed25519-dalek = { workspace = true }
hex = { workspace = true }

[[bin]]
name = "obsign"
path = "src/main.rs"
